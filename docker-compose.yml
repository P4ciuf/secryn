services:
  db:
    image: postgres:18-alpine
    container_name: secryn_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - secryn_db:/var/lib/postgresql
    networks:
      - secryn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secryn_redis
    restart: unless-stopped
    volumes:
      - secryn_redis:/data
    networks:
      - secryn-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./
      dockerfile: app/Dockerfile
    container_name: secryn_app
    restart: unless-stopped
    env_file: .env
    networks:
      - secryn-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./
      dockerfile: nginx/Dockerfile
    container_name: secryn_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - secryn-net
    depends_on:
      - app

networks:
  secryn-net:
    driver: bridge

volumes:
  secryn_db:
  secryn_redis:

services:
  db:
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - secryn_db:/var/lib/postgresql/data
    networks:
      - secryn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - secryn_redis:/data
    networks:
      - secryn-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file: .env
    networks:
      - secryn-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - secryn-net
    depends_on:
      api:
        condition: service_healthy

networks:
  secryn-net:
    driver: bridge

volumes:
  secryn_db:
  secryn_redis:

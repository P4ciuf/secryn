version: "3.9"

services:
  db:
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - securevault_db:/var/lib/postgresql
    networks:
      - securevault-net

  api:
    build:
      context: ./
      dockerfile: apps/api/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - securevault-net
    depends_on:
      - db

  web:
    build:
      context: ./
      dockerfile: apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - securevault-net
    depends_on:
      - api

networks:
  securevault-net:
    driver: bridge

volumes:
  securevault_db:

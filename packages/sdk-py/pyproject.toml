[project]
name = "secryn"
version = "1.0.1"
description = "Secryn Python SDK — manage secrets, projects, and API keys programmatically"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Secryn" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.urls]
Repository = "https://github.com/P4ciuf/secryn"
Homepage = "https://secryn.xyz"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

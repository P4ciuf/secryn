[project]
name = "securevault-cli"
version = "0.1.0"
description = "SecureVault CLI — manage your secrets from the terminal"
license = { text = "Apache-2.0" }
authors = [{ name = "SecureVault" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
]

[project.scripts]
sv = "securevault_cli.cli:main"

[project.urls]
Repository = "https://github.com/securevault/securevault"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"



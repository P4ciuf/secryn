name: SDK TS CI

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-ts/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/sdk-ts/**"

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter secryn build

      - name: Typecheck
        run: pnpm --filter secryn typecheck

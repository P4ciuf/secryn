name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ~/secryn

            echo "Preserving .env files..."
            for f in .env app/.env; do
              [ -f "$f" ] && cp "$f" "/tmp/$(basename "$f").bak"
            done

            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Restoring .env files..."
            for f in .env app/.env; do
              if [ -f "/tmp/$(basename "$f").bak" ]; then
                cp "/tmp/$(basename "$f").bak" "$f"
              elif [ ! -f "$f" ] && [ -f "$f.example" ]; then
                echo "WARNING: $f not found, creating from $f.example"
                cp "$f.example" "$f"
              fi
            done

            echo "Rebuilding and restarting services..."
            docker compose up --build -d

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete. Status:"
            docker compose ps
